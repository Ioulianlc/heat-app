<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9f5f1" />
    <script>
      // Thème sombre choisi dans le profil : appliqué avant le premier affichage, sans flash clair
      try {
        if (JSON.parse(localStorage.getItem('heat.preferences') || '{}').darkMode) {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#43150c'
        }
      } catch {
        // Mémoire du téléphone bloquée : on reste en thème clair
      }
    </script>
    <!-- App installable sur l'écran d'accueil (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="HEAT" />
    <title>HEAT</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
